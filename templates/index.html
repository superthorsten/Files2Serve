<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Files2Serve</title>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto flex min-h-screen max-w-3xl items-center px-6 py-12">
        <section class="w-full rounded-2xl border border-slate-800 bg-slate-900 p-8 shadow-2xl shadow-slate-950/50 sm:p-12">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-cyan-400">Files2Serve</p>
            <h1 class="text-4xl font-bold tracking-tight text-white sm:text-5xl">Willkommen</h1>
            <form class="mt-8 border-t border-slate-800 pt-8" action="/" method="post">
                <label class="mb-2 block text-sm font-medium text-slate-200" for="upload-hash">Upload-Hash</label>
                <div class="flex flex-col gap-3 sm:flex-row">
                    <input class="w-full rounded-lg border border-slate-700 bg-slate-950 px-4 py-3 text-sm text-white outline-none placeholder:text-slate-600 focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400" id="upload-hash" name="upload_hash" type="text" placeholder="Upload-Hash eingeben" autocomplete="off" required>
                    <button class="rounded-lg bg-cyan-400 px-5 py-3 text-sm font-bold text-slate-950 transition hover:bg-cyan-300 focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:ring-offset-2 focus:ring-offset-slate-900" type="submit">Anzeigen</button>
                </div>
                {% if error %}
                <p class="mt-3 text-sm font-semibold text-red-400" role="alert">{{ error }}</p>
                {% endif %}
            </form>
        </section>
    </main>
</body>
</html>
