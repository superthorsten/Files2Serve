<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Interne Verwaltung | Files2Serve</title>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-6xl px-6 py-12">
        <header class="mb-8">
            <p class="mb-3 text-sm font-semibold uppercase tracking-[0.2em] text-cyan-400">Files2Serve</p>
            <h1 class="text-3xl font-bold tracking-tight text-white">Interne Verwaltung</h1>
        </header>

        <section class="overflow-hidden rounded-2xl border border-slate-800 bg-slate-900 shadow-2xl shadow-slate-950/50">
            {% if files %}
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-slate-800 text-left text-sm">
                    <thead class="bg-slate-950/60 text-xs uppercase tracking-wide text-slate-400">
                        <tr>
                            <th class="px-5 py-4">Titel</th>
                            <th class="px-5 py-4">Datei</th>
                            <th class="px-5 py-4">ID</th>
                            <th class="px-5 py-4">Ablaufdatum</th>
                            <th class="px-5 py-4">Aktion</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-slate-800">
                        {% for file in files %}
                        <tr>
                            <td class="px-5 py-4 font-medium text-white">{{ file.title }}</td>
                            <td class="px-5 py-4 text-slate-300">{{ file.filename }}</td>
                            <td class="px-5 py-4 text-slate-400">{{ file.item_id }}</td>
                            <td class="px-5 py-4 text-slate-400">{{ file.expiry_date or "Keine" }}</td>
                            <td class="px-5 py-4">
                                <form action="/internal-admin/{{ file.hash }}/delete" method="post">
                                    <button class="rounded-lg border border-red-500/50 px-3 py-2 text-xs font-semibold text-red-300 hover:bg-red-500/10" type="submit">Löschen</button>
                                </form>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <p class="px-5 py-8 text-slate-400">Keine Uploads vorhanden.</p>
            {% endif %}
        </section>
    </main>
</body>
</html>
